<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1024px;height:1024px;overflow:hidden;background:#000}
.i{position:relative;width:1024px;height:1024px;overflow:hidden;background:radial-gradient(130% 110% at 22% 10%,#6a5df0 0%,#2f2699 36%,#0d0f3d 70%,#05061c 100%)}
.c{position:absolute;border-radius:50%}
.halo{left:62px;top:62px;width:900px;height:900px;background:radial-gradient(circle,rgba(255,200,130,.62) 0%,rgba(255,150,80,.2) 38%,transparent 66%)}
.ring2{left:152px;top:132px;width:720px;height:720px;border:3px solid rgba(255,255,255,.2)}
.ring1{left:232px;top:212px;width:560px;height:560px;border:7px solid rgba(255,255,255,.58);box-shadow:0 0 50px rgba(255,200,140,.55),inset 0 0 50px rgba(255,200,140,.28)}
.core{left:362px;top:342px;width:300px;height:300px;background:radial-gradient(circle at 40% 36%,#fff 0 22%,#fff1d6 42%,#ffc67a 74%,#ff9648 100%);box-shadow:0 0 130px 46px rgba(255,190,120,.72)}
.streak{position:absolute;left:0;top:489px;width:1024px;height:6px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6) 50%,transparent);filter:blur(1.5px)}
.dock{position:absolute;left:252px;top:812px;width:520px;height:98px;border-radius:49px;background:rgba(255,255,255,.1);border:2.5px solid rgba(255,255,255,.3);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.dock i{position:absolute;top:19px;width:80px;height:56px;border-radius:18px;background:rgba(255,255,255,.4)}
.dock i.a{background:#fff;box-shadow:0 0 24px rgba(255,255,255,.7)}
.sheen{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.16),transparent 34%)}
</style><div class="i"><div class="c halo"></div><div class="c ring2"></div><div class="c ring1"></div><div class="streak"></div><div class="c core"></div>
