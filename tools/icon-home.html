<!doctype html><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}html,body{width:1024px;height:1024px;overflow:hidden;background:#000}
.i{position:relative;width:1024px;height:1024px;overflow:hidden;background:linear-gradient(165deg,#3a3f5c 0%,#161828 46%,#07080f 100%)}
.glow{position:absolute;left:162px;top:250px;width:700px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(255,196,128,.50) 0%,rgba(255,150,90,.14) 42%,transparent 68%)}
svg{position:absolute;left:0;top:0;width:1024px;height:1024px}
.sheen{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.10),transparent 40%)}
</style><div class="i"><div class="glow"></div>
<svg viewBox="0 0 1024 1024">
 <defs>
  <radialGradient id="door" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#fff"/><stop offset=".38" stop-color="#fff3de"/><stop offset=".74" stop-color="#ffd29a"/><stop offset="1" stop-color="#ffae6a"/></radialGradient>
  <filter id="halo" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>

 </defs>

 <rect x="432" y="560" width="160" height="210" rx="34" fill="rgba(255,190,120,.85)" filter="url(#halo)"/>
