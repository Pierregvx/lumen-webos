# Builds the public .ipk (no app/private/) and publishes it as a GitHub release.
#  - a tag v* (v1.1.0): a release of that name; with a hyphen (v1.1.0-rc.1) a prerelease
#  - a push to any branch other than main: replaces the rolling prerelease "dev" with a build of that commit
name: release
on:
  push:
    tags: ['v*']
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build the .ipk
        run: python3 tools/build_release.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF: ${{ github.ref_name }}
        run: |
          IPK=$(ls release/*.ipk)
          SUM=$(sha256sum "$IPK" | cut -d' ' -f1)
          if [ "$REF_TYPE" = tag ]; then
            TAG=$REF; PRE=; case "$TAG" in *-*) PRE=--prerelease ;; esac
          else
            TAG=dev; PRE=--prerelease
            gh release delete dev --yes --cleanup-tag 2>/dev/null || true
          fi
          printf 'Built from %s.\n\nInstall: drop the .ipk onto Dev Manager, or `ares-install --device lgtv %s`.\n\nSHA-256: `%s`\n' \
            "$GITHUB_SHA" "$(basename "$IPK")" "$SUM" > notes.md
          gh release create "$TAG" "$IPK" --target "$GITHUB_SHA" --title "Lumen $TAG ($REF, ${GITHUB_SHA:0:7})" --notes-file notes.md $PRE
